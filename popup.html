<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tab Volume Boost</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Tab Volume Boost</h1>
      <p id="tab-title" class="tab-title"></p>
      <div class="volume-heading">
        <label for="volume">このタブの音量</label>
        <output id="volume-value" for="volume">100%</output>
      </div>
      <input id="volume" type="range" min="0" max="500" step="10" value="100" disabled>
      <div class="scale"><span>0%</span><span>100%</span><span>500%</span></div>
      <div class="number-row">
        <label for="volume-number">数値で指定</label>
        <div class="number-input">
          <input id="volume-number" type="number" min="0" step="any" value="100" inputmode="decimal" disabled>
          <span>%</span>
        </div>
      </div>
      <button id="toggle" type="button" disabled>読み込み中…</button>
      <p id="status" role="status" aria-live="polite"></p>
      <p class="hint">スライダーは500%まで。超える値は数値で指定できます。高い倍率では音がひずむ場合があります。</p>
    </main>
  </body>
</html>
